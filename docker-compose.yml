# ============================================================
# ChatNote — Full-Stack Docker Compose
# 
# Start:    docker compose up -d
# Stop:     docker compose down
# Logs:     docker compose logs -f
# Migrate:  docker compose exec backend alembic upgrade head
# ============================================================

services:
  # ── Database ──────────────────────────────────────────
  postgres:
    image: pgvector/pgvector:pg17
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: chatnote
      POSTGRES_USER: chatnote
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-changeme}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./backend/docker-init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U chatnote"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - chatnote-net

  # ── Backend API ───────────────────────────────────────
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    restart: unless-stopped
    environment:
      - DATABASE_URL=${DATABASE_URL:-postgresql+asyncpg://chatnote:changeme@postgres:5432/chatnote}
      - SECRET_KEY=${SECRET_KEY:-chatnote-secret-key-change-in-production}
      - ENCRYPTION_KEY=${ENCRYPTION_KEY}
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - MOONSHOT_API_KEY=${MOONSHOT_API_KEY}
      - EMBEDDING_MODEL=${EMBEDDING_MODEL:-text-embedding-3-small}
      - EMBEDDING_DIMENSIONS=${EMBEDDING_DIMENSIONS:-768}
      - DEBUG=${DEBUG:-false}
      - UPLOAD_DIR=./uploads
    volumes:
      - uploads:/app/uploads
      - backend_data:/app/data
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - chatnote-net

  # ── Frontend (Nginx + React SPA) ─────────────────────
  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    restart: unless-stopped
    ports:
      - "${PORT:-9001}:9001"
    depends_on:
      - backend
    networks:
      - chatnote-net

volumes:
  pgdata:
  uploads:
  backend_data:

networks:
  chatnote-net:
    driver: bridge
