services:
  postgres:
    image: pgvector/pgvector:pg17
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: chatnote
      POSTGRES_USER: chatnote
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-changeme}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./backend/docker-init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U chatnote"]
      interval: 5s
      timeout: 5s
      retries: 5

  pgbouncer:
    image: bitnami/pgbouncer:latest
    ports:
      - "6432:6432"
    environment:
      PGBOUNCER_POOL_MODE: transaction
      PGBOUNCER_DEFAULT_POOL_SIZE: "10"
      PGBOUNCER_MAX_CLIENT_CONN: "200"
      PGBOUNCER_AUTH_TYPE: trust
      POSTGRESQL_HOST: postgres
      POSTGRESQL_PORT: "5432"
      POSTGRESQL_USERNAME: chatnote
      POSTGRESQL_PASSWORD: ${POSTGRES_PASSWORD:-changeme}
      POSTGRESQL_DATABASE: chatnote
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  pgdata:
